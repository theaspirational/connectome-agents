# Reviewed source; payload contains vendored dependencies. No install at deployment.
zulip_mcp:
  repo: https://github.com/theaspirational/zulip_mcp.git
  pin_ref: connectors.zulip_mcp
  enabled: true
  build:
  - - '{artifact:node}/bin/node'
    - node_modules/typescript/bin/tsc
  settings:
    command: '{artifact:node}/bin/node'
    args:
    - '{artifact:zulip_mcp}/build/index.js'
    - --stdio
  required_secrets:
  - ZULIP_API_KEY
