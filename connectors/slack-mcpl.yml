# Candidate upstream metadata; verify offline-unavailable refs before use.
slack-mcpl:
  repo: https://github.com/anima-research/slack-mcpl.git
  pin_ref: connectors.slack-mcpl
  enabled: true
  build:
  - - bun
    - install
    - --frozen-lockfile
