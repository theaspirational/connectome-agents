---
# Thin layer over connectome-kitchen for one deployment without a catalog. See docs/kitchen.md.
# One run is one operation on one agent:
#   name | plan | prepare | verify | start | rollback | readback | clear
# and, for an agent that is installed from nothing (connectome_kitchen_first_install):
#   name | plan | prepare | verify | start | readback | remove
connectome_kitchen_operation: ""

# The kitchen install: a directory with dist/, scripts/takeover.mjs and KITCHEN_COMMIT.
connectome_kitchen_home: ""
# The commit that install must be (40 hex). The role refuses any other KITCHEN_COMMIT.
connectome_kitchen_commit: ""
# Optional: a SHA256SUMS file whose directory holds the install; checked before every operation.
connectome_kitchen_sums_file: ""
# The Node that runs kitchen (absolute).
connectome_kitchen_node: ""

# The account of the agent. The engine runs as it, never as root.
connectome_kitchen_account: ""
# The home of that account, as the account database has it. No default: it is named, not guessed.
connectome_kitchen_account_home: ""
connectome_kitchen_account_uid: ""
connectome_kitchen_runtime_dir: "/run/user/{{ connectome_kitchen_account_uid }}"
connectome_kitchen_systemctl: /usr/bin/systemctl
# The uid this play must run as (the operator: root on a host).
connectome_kitchen_operator_uid: 0
# How a command becomes the account's. Empty only where the play already runs as the account (a sandbox).
connectome_kitchen_as_account: [/usr/sbin/runuser, -u, "{{ connectome_kitchen_account }}", --]
# The whole environment of every kitchen process. Nothing of the caller's reaches it.
connectome_kitchen_environment:
  - "HOME={{ connectome_kitchen_account_home }}"
  - "USER={{ connectome_kitchen_account }}"
  - "LOGNAME={{ connectome_kitchen_account }}"
  - PATH=/usr/bin:/bin
  - LANG=C.UTF-8
  - "XDG_RUNTIME_DIR={{ connectome_kitchen_runtime_dir }}"
  - "DBUS_SESSION_BUS_ADDRESS=unix:path={{ connectome_kitchen_runtime_dir }}/bus"

# The same variables the Python role takes, so an inventory serves both.
connectome_base: "{{ connectome_kitchen_account_home }}/.local/share/connectome"
connectome_root: "{{ connectome_base }}/{{ connectome_agent.name }}"
connectome_unit_dir: "{{ connectome_kitchen_account_home }}/.config/systemd/user"
connectome_private: {}
connectome_group: {}
connectome_agent: {}
connectome_versions_file: "{{ role_path }}/../../versions.yml"
connectome_cook_command: []
# Public defaults and connector descriptors. A deployed agent pins the public commit it was built from: point these at
# that checkout, or the request (and so the build's name) is another one.
connectome_kitchen_defaults_file: "{{ role_path }}/../../defaults/agent.yml"
connectome_kitchen_catalog_dir: "{{ role_path }}/../../connectors"
# The closed record of contract v1. Default: the four paths of the role's cook command.
connectome_kitchen_engines: {}

# The build `current` names now, and the build this request must give (64 hex each). Both are pins: the runner refuses
# when the host says otherwise. `name` works without the second and prints it.
connectome_kitchen_live_build: ""
connectome_kitchen_build: ""

# A first install: nothing of this agent is deployed. No live build is named (connectome_kitchen_live_build stays
# empty); kitchen's runner is told so and holds it. `prepare` saves nothing and keeps a marker in the save directory;
# `verify` holds the new build by itself; `start` is the first start; `rollback` and `clear` are refused, and `remove`
# is the way out. Once the agent runs, its next window is a takeover: this off, and its build as the live one.
connectome_kitchen_first_install: false
# In place of the agent's IDLE, which nobody can give yet: the operator's own word for this run, named and dated, held
# to connectome_kitchen_idle_max_age_minutes like an IDLE.
#   start:   -e connectome_kitchen_operator_word="FIRST-START <name> <UTC time, YYYY-MM-DDTHH:MMZ>"
#   remove:  -e connectome_kitchen_operator_word="REMOVE <name> <UTC time, YYYY-MM-DDTHH:MMZ>"
connectome_kitchen_operator_word: ""
# `remove` leaves the agent's state directory unless this is true. It never touches the secrets file.
connectome_kitchen_remove_state: false

# Where `prepare` keeps what `rollback` needs. The operator's, mode 0700, outside the home of the account.
connectome_kitchen_save_dir: "/var/lib/connectome-kitchen/save/{{ connectome_agent.name }}"

# `start` and `rollback` restart the agent. They need the agent's own word that it is idle, given for this run:
#   -e connectome_kitchen_idle="IDLE <name> <UTC time, YYYY-MM-DDTHH:MMZ>"
# and refuse a word older than this many minutes, or one from the future.
connectome_kitchen_idle: ""
connectome_kitchen_idle_max_age_minutes: 15
# `rollback` of an agent that is down has nobody to ask. Then, and only then: true.
connectome_kitchen_agent_is_down: false
# After `start`: the same process must still run after this many seconds.
connectome_kitchen_watch_seconds: 120
connectome_kitchen_runner_timeout_seconds: 300
# On a failed start or a failed watch, put the previous build back at once. For a first install: remove what the
# start installed at once (the state directory stays).
connectome_kitchen_auto_rollback: true
# Start although the secrets file gives the new process another environment than the running one has: every
# difference, named or not (a rotated key, another base URL). The names that differ are printed by `verify`; no value is.
connectome_kitchen_secrets_differ_ok: false
# The secret files (by the name of their environment variable) this request adds: the running deployment has none of
# them. With them named, `start` takes an environment file that has exactly these names more and differs in nothing
# else, name by name (files/kitchen-secrets.mjs), as long as every other secret file is what the start would write and
# none of the named ones is there yet. A direct value that changed, or any other name added or removed, still refuses:
# naming a new file authorizes that file and nothing beside it. `clear` removes exactly these files after a rollback.
connectome_kitchen_secret_files_new: []

# What `verify` and `readback` hold the recipe to. Paths are RFC 6901 pointers into the recipe.
# The leaves in which the new cooked recipe may differ from the live one (after the build's name is replaced).
connectome_kitchen_recipe_changes: []
connectome_kitchen_recipe_absent: []
connectome_kitchen_recipe_present: []
# The leaves of the cook lock that name servers, engines, requirements or credentials and are to differ, as above. The
# lock's lists of named things are read by name: one server more is `/external/<name>`, a credential `/credentials/<NAME>`.
connectome_kitchen_lock_changes: []
# MCP servers (by their name in the recipe) whose last connection line in the journal must say connected at `readback`.
# For the others no line against them is enough.
connectome_kitchen_servers_connected: []
# `readback` holds the planner's hardBudget to the one of the process before the start. For a window that changes the
# budget of the recipe: true, and both numbers are reported with none held. `readback` never writes a setting.
connectome_kitchen_budget_reported_only: false
connectome_kitchen_journalctl: /usr/bin/journalctl
connectome_kitchen_python: /usr/bin/python3
