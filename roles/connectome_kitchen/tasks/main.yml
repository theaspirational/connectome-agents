---
# One operation of connectome-kitchen on one agent. Nothing here builds, links or restarts by itself: the runner of
# kitchen (scripts/takeover.mjs over src/engine.ts) does, as the account of the agent. This file gathers the request,
# hands it over, reads the answer, and keeps the gates of a window. It never calls the module of the Python role.
# With connectome_kitchen_first_install the same operations install an agent from nothing (docs/kitchen.md, A first
# install): there is no running build to save, to compare with or to go back to, and `remove` is the way out.

- name: Refuse the retired state-deletion option
  ansible.builtin.assert:
    that: connectome_kitchen_remove_state is not defined
    fail_msg: "connectome_kitchen_remove_state was removed. Unset it (even if false). The role never deletes agent state; handle state separately as an operator action. Nothing was changed."

- name: Refuse an unusable invocation before anything is read
  ansible.builtin.assert:
    that:
      - connectome_kitchen_operation in ['name', 'plan', 'prepare', 'verify', 'start', 'rollback', 'readback', 'clear'] or (connectome_kitchen_operation == 'remove' and connectome_kitchen_first_install | bool)
      - not (connectome_kitchen_first_install | bool) or connectome_kitchen_operation not in ['rollback', 'clear']
      - not ansible_check_mode
      - ansible_connection == 'local'
      - connectome_kitchen_home is match('^/[A-Za-z0-9_./@+-]+$')
      - connectome_kitchen_node is match('^/[A-Za-z0-9_./@+-]+$')
      - connectome_kitchen_commit is match('^[0-9a-f]{40}$')
      - connectome_kitchen_account is match('^[a-z_][a-z0-9_-]{0,31}$')
      - connectome_kitchen_account_home is match('^/[A-Za-z0-9_./@+-]+$')
      - (connectome_kitchen_account_uid | string) is match('^[1-9][0-9]*$')
      - connectome_kitchen_live_build is match('^[0-9a-f]{64}$') or (connectome_kitchen_first_install | bool)
      - connectome_kitchen_live_build == '' or not (connectome_kitchen_first_install | bool)
      - (connectome_kitchen_agreed_drift | length) == 0 or not (connectome_kitchen_first_install | bool)
      - connectome_kitchen_build == '' or connectome_kitchen_build is match('^[0-9a-f]{64}$')
      - connectome_kitchen_build == '' or connectome_kitchen_build != connectome_kitchen_live_build
      - connectome_kitchen_operation in ['name', 'plan'] or connectome_kitchen_build != ''
      - connectome_agent.name is defined and connectome_agent.name is match('^[a-z0-9][a-z0-9-]{0,62}$')
      - connectome_agent.activation | default('start') == 'start'
      - connectome_kitchen_save_dir is match('^/[A-Za-z0-9_./@+-]+$')
      - not (connectome_kitchen_save_dir + '/').startswith(connectome_kitchen_account_home + '/')
      - connectome_kitchen_secret_files_new is sequence and connectome_kitchen_secret_files_new is not string
      - connectome_kitchen_secret_files_new | reject('match', '^[A-Z_][A-Z0-9_]*$') | list | length == 0
      - "connectome_kitchen_agreed_drift is sequence and connectome_kitchen_agreed_drift is not string and connectome_kitchen_agreed_drift is not mapping and (connectome_kitchen_agreed_drift | reject('mapping') | list | length) == 0 and (connectome_kitchen_agreed_drift | map('dict2items') | map('map', attribute='key') | map('sort') | map('join', ' ') | reject('equalto', 'path sha256') | list | length) == 0 and (connectome_kitchen_agreed_drift | map(attribute='path') | reject('string') | list | length) == 0 and (connectome_kitchen_agreed_drift | map(attribute='sha256') | map('string') | reject('match', '^[0-9a-f]{64}$') | list | length) == 0"
    fail_msg: "Unusable connectome_kitchen invocation. One operation (name, plan, prepare, verify, start, rollback, readback, clear) on one agent, on the host of the agent, not in check mode (plan is the dry run), with the kitchen install, its commit, the Node, the account with its home and uid, a save directory outside that home, the live build and (but for name and plan) the build this request must give. A first install (connectome_kitchen_first_install) names no live build and no agreed drift, has remove in place of rollback and clear, and is the only place for remove. An agreed drift, if any, is a list of {path, sha256} (64 hex). Nothing was changed."

- name: Name what the operation works on
  ansible.builtin.set_fact:
    ck_name: "{{ connectome_agent.name }}"
    ck_unit: "connectome-{{ connectome_agent.name }}.service"
    ck_keep: "{{ connectome_kitchen_account_home }}/kitchen-takeover/{{ connectome_agent.name }}"
    ck_as: "{{ connectome_kitchen_as_account + ['/usr/bin/env', '-i'] + connectome_kitchen_environment }}"
    ck_restarts: "{{ connectome_kitchen_operation in ['start', 'rollback'] }}"
    ck_engine: "{{ connectome_kitchen_operation in ['name', 'plan', 'prepare', 'verify', 'start'] }}"
    ck_pointers: ["/bin/bash", "{{ role_path }}/files/kitchen-pointers.sh"]
    ck_pointers_env:
      KITCHEN_NAME: "{{ connectome_agent.name }}"
      KITCHEN_ACCOUNT: "{{ connectome_kitchen_account }}"
      KITCHEN_UID: "{{ connectome_kitchen_account_uid | string }}"
      KITCHEN_OPERATOR_UID: "{{ connectome_kitchen_operator_uid | string }}"
      KITCHEN_ACCOUNT_HOME: "{{ connectome_kitchen_account_home }}"
      KITCHEN_RUNTIME_DIR: "{{ connectome_kitchen_runtime_dir }}"
      KITCHEN_ROOT: "{{ connectome_root }}"
      KITCHEN_UNIT_DIR: "{{ connectome_unit_dir }}"
      KITCHEN_SAVE: "{{ connectome_kitchen_save_dir }}"
      KITCHEN_OLD: "{{ connectome_kitchen_live_build }}"
      KITCHEN_SYSTEMCTL: "{{ connectome_kitchen_systemctl }}"
      KITCHEN_AS_ACCOUNT: "{{ connectome_kitchen_as_account | join(' ') }}"

# A first install: nothing is deployed, so there is no build to save, to compare with or to go back to. Its own script
# stands where files/kitchen-pointers.sh stands for a deployment that runs.
- name: Name what a first install works with
  ansible.builtin.set_fact:
    ck_first: "{{ connectome_kitchen_first_install | bool }}"
    ck_removes: "{{ connectome_kitchen_operation == 'remove' }}"
    ck_first_script: ["/bin/bash", "{{ role_path }}/files/kitchen-first.sh"]
    ck_first_env: "{{ ck_pointers_env | combine({'KITCHEN_STATE_DIR': connectome_agent.state_dir | default(''), 'KITCHEN_SECRETS_FILE': connectome_agent.secrets_file | default(''), 'KITCHEN_PROTECTED_PATHS': ck_first_protected | to_json}) }}"
  vars:
    ck_first_engines: "{{ connectome_kitchen_engines if connectome_kitchen_engines else ((connectome_cook_command | connectome_kitchen_engines) if connectome_cook_command else {}) }}"
    ck_first_protected: "{{ [role_path, connectome_kitchen_home, connectome_kitchen_sums_file, connectome_kitchen_node, connectome_kitchen_systemctl, connectome_kitchen_python, connectome_kitchen_journalctl, connectome_versions_file, connectome_kitchen_defaults_file, connectome_kitchen_catalog_dir, (connectome_agent.recipe_file | default({})).path | default('')] + (connectome_agent.cook.host_dependencies | default([]) | map(attribute='archive') | list) + (ck_first_engines.cook | default({}) | dict2items | map(attribute='value') | list) }}"
  when: connectome_kitchen_first_install | bool

- name: Select the takeover path for this invocation
  ansible.builtin.set_fact:
    ck_first: false
    ck_removes: false
  when: not (connectome_kitchen_first_install | bool)

# Who runs this, and with which kitchen.

- name: Ask who runs this play and from where
  ansible.builtin.shell:
    cmd: 'id -u; id -u "$ACCOUNT"; cat "$HOME_OF_KITCHEN/KITCHEN_COMMIT"; grep -c -- "$UNIT" /proc/self/cgroup; true'
  environment:
    ACCOUNT: "{{ connectome_kitchen_account }}"
    HOME_OF_KITCHEN: "{{ connectome_kitchen_home }}"
    UNIT: "{{ ck_unit }}"
  changed_when: false
  register: ck_who

- name: Refuse another operator, account or kitchen than the ones named
  ansible.builtin.assert:
    that:
      - ck_who.stdout_lines | length == 4
      - ck_who.stdout_lines[0] == (connectome_kitchen_operator_uid | string)
      - ck_who.stdout_lines[1] == (connectome_kitchen_account_uid | string)
      - ck_who.stdout_lines[1] != '0'
      - ck_who.stdout_lines[2] == connectome_kitchen_commit
    fail_msg: "This play must run as uid {{ connectome_kitchen_operator_uid }}, the account {{ connectome_kitchen_account }} must be uid {{ connectome_kitchen_account_uid }} and not root, and KITCHEN_COMMIT of the kitchen install must be {{ connectome_kitchen_commit }}. Nothing was changed."

- name: Hold the kitchen install against its digests
  ansible.builtin.command:
    argv: ["/usr/bin/sha256sum", "-c", "--quiet", "{{ connectome_kitchen_sums_file | basename }}"]
    chdir: "{{ connectome_kitchen_sums_file | dirname }}"
  changed_when: false
  when: connectome_kitchen_sums_file != ''

# The gates of a restart: an executor outside the unit of the agent, and the agent's own word that it is idle.

- name: Refuse to restart an agent from inside its own unit
  ansible.builtin.assert:
    that: ck_who.stdout_lines[3] == '0'
    fail_msg: "This play runs inside {{ ck_unit }}: the restart would end it half way. Run it from outside the unit; for an agent that runs its own window, as a transient unit of the system manager (docs/kitchen.md, The executor). Nothing was changed."
  when: ck_restarts or ck_removes

- name: Read the clock for the idle gate
  ansible.builtin.command:
    argv: ["/usr/bin/date", "-u", "+%s"]
  changed_when: false
  register: ck_now
  when: ck_restarts or ck_removes

- name: Refuse a restart without the agent's own IDLE for this run
  ansible.builtin.assert:
    that:
      - connectome_kitchen_idle is match('^IDLE ' + ck_name + ' [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}Z$')
      - (ck_now.stdout | int) - (ck_idle_at | int) >= -60
      - (ck_now.stdout | int) - (ck_idle_at | int) <= (connectome_kitchen_idle_max_age_minutes | int) * 60
    fail_msg: "{{ connectome_kitchen_operation }} restarts {{ ck_name }} and needs its own word that it is idle, given for this run as connectome_kitchen_idle: IDLE {{ ck_name }} and the UTC time of that word as YYYY-MM-DDTHH:MMZ, no older than {{ connectome_kitchen_idle_max_age_minutes }} minutes. Nothing was changed."
  vars:
    ck_idle_at: "{{ ((connectome_kitchen_idle.split(' ')[2] | default('1970-01-01T00:00Z')) | to_datetime('%Y-%m-%dT%H:%MZ') - ('1970-01-01T00:00Z' | to_datetime('%Y-%m-%dT%H:%MZ'))).total_seconds() | int }}"
  when: ck_restarts and not ck_first and not (connectome_kitchen_operation == 'rollback' and connectome_kitchen_agent_is_down | bool)

# A first install has no agent to say it is idle. What stands in its place is the operator's own word for this run, named
# and dated: that this agent is to be started for the first time, or that its first install is to be removed.
- name: Refuse a first start or a removal without the operator's own dated word for this run
  ansible.builtin.assert:
    that:
      - connectome_kitchen_operator_word is match('^' + ck_word + ' ' + ck_name + ' [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}Z$')
      - (ck_now.stdout | int) - (ck_word_at | int) >= -60
      - (ck_now.stdout | int) - (ck_word_at | int) <= (connectome_kitchen_idle_max_age_minutes | int) * 60
    fail_msg: "{{ connectome_kitchen_operation }} of a first install {{ 'starts' if ck_restarts else 'stops and removes' }} {{ ck_name }} and needs your own word for this run, as connectome_kitchen_operator_word: {{ ck_word }} {{ ck_name }} and the UTC time of that word as YYYY-MM-DDTHH:MMZ, no older than {{ connectome_kitchen_idle_max_age_minutes }} minutes. Nothing was changed."
  vars:
    ck_word: "{{ 'FIRST-START' if ck_restarts else 'REMOVE' }}"
    ck_word_at: "{{ ((connectome_kitchen_operator_word.split(' ')[2] | default('1970-01-01T00:00Z')) | to_datetime('%Y-%m-%dT%H:%MZ') - ('1970-01-01T00:00Z' | to_datetime('%Y-%m-%dT%H:%MZ'))).total_seconds() | int }}"
  when: ck_first and (ck_restarts or ck_removes)

# The request, from the same layers the Python role takes. Kitchen merges them (src/config.ts); this only gathers.

- name: Gather the request from the layers (controller side; the host is not touched)
  ansible.builtin.include_tasks: request.yml
  when: ck_engine

- name: Refuse a deployment this layer does not serve
  ansible.builtin.assert:
    that:
      - connectome_agent.recipe_file is defined
      - connectome_agent.recipe_file.path is match('^/')
      - connectome_agent.recipe_file.sha256 is match('^[0-9a-f]{64}$')
      - connectome_agent.state_dir is defined and connectome_agent.secrets_file is defined
      - connectome_root == connectome_base + '/' + ck_name
    fail_msg: "connectome_kitchen serves a deployment with a pinned recipe file (no catalog), a state directory and a secrets file named in the agent layer, under the base directory by its name. Catalog and spawn deployments stay with the Python role. Nothing was changed."
  when: ck_engine

- name: Check first-install paths before staging any inputs
  ansible.builtin.command:
    argv: "{{ ck_first_script + ['scope'] }}"
  environment: "{{ ck_first_env }}"
  changed_when: false
  when: ck_first and ck_engine

- name: Make the directory of the account for the log, the receipts and the inputs of kitchen
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ connectome_kitchen_account }}"
    mode: "0700"
  loop:
    - "{{ connectome_kitchen_account_home }}/kitchen-takeover"
    - "{{ ck_keep }}"
    - "{{ ck_keep }}/inputs"
  when: ck_engine

# The recipe is the file of the controller (the operator) and may be unreadable for the account. It is held against its
# pin here and handed over as a file of the account; the runner holds it against the pin again and the engine stages
# it in the build. It does not leave the host.
- name: Read the digest of the pinned recipe
  ansible.builtin.stat:
    path: "{{ connectome_agent.recipe_file.path }}"
    checksum_algorithm: sha256
    get_checksum: true
    follow: false
  register: ck_recipe
  when: ck_engine

- name: Refuse a recipe that is not the pinned bytes
  ansible.builtin.assert:
    that:
      - ck_recipe.stat.exists and ck_recipe.stat.isreg
      - ck_recipe.stat.checksum == connectome_agent.recipe_file.sha256
    fail_msg: "The recipe file is not a regular file with the pinned digest. Nothing was changed. (Its text is never shown.)"
  when: ck_engine

- name: Hand the pinned recipe to the account
  ansible.builtin.copy:
    src: "{{ connectome_agent.recipe_file.path }}"
    dest: "{{ ck_keep }}/inputs/cook-recipe.{{ connectome_agent.recipe_file.sha256 }}.json"
    remote_src: true
    owner: "{{ connectome_kitchen_account }}"
    mode: "0600"
  no_log: true
  when: ck_engine

- name: Write the request for the runner of kitchen
  ansible.builtin.copy:
    dest: "{{ ck_keep }}/inputs/request.json"
    owner: "{{ connectome_kitchen_account }}"
    mode: "0600"
    content: "{{ ck_document | to_nice_json }}"
  when: ck_engine

# name: what the engine calls the build of this request. Read-only.

- name: Ask the engine for the name of the build (plan; nothing is written)
  ansible.builtin.command:
    argv: "{{ ck_as + [connectome_kitchen_node, role_path + '/files/kitchen-name.mjs', connectome_kitchen_home, ck_keep + '/inputs/request.json'] }}"
    chdir: "{{ connectome_kitchen_home }}"
  changed_when: false
  failed_when: false
  no_log: true
  register: ck_named
  when: connectome_kitchen_operation == 'name' or (connectome_kitchen_operation == 'plan' and connectome_kitchen_build == '')

- name: Show the name
  ansible.builtin.debug:
    msg:
      - "exit {{ ck_named.rc }}"
      - "{{ (ck_named.stdout | from_json) if ck_named.rc in [0, 1] and ck_named.stdout else (ck_named.stderr_lines | select('match', '^kitchen-name: ') | list) }}"
      - "{{ ('connectome_kitchen_build: ' + (ck_named.stdout | from_json).build) if ck_named.rc == 0 else 'no name' }}"
      - "{{ ('the pinned connectome_kitchen_build is ' + ('the same' if ck_named.rc == 0 and (ck_named.stdout | from_json).build == connectome_kitchen_build else 'ANOTHER ONE')) if connectome_kitchen_build != '' else 'pin this name as connectome_kitchen_build for plan, prepare, verify and start' }}"
  when: ck_named is not skipped

- name: Stop where the engine gave no name, or another one than the pinned
  ansible.builtin.assert:
    that:
      - ck_named.rc == 0
      - connectome_kitchen_build == '' or (ck_named.stdout | from_json).build == connectome_kitchen_build
    fail_msg: "The engine did not name the build, or names it otherwise than connectome_kitchen_build. Nothing was changed."
  when: ck_named is not skipped

# prepare, first: keep what the way back needs, before the engine writes anything.

- name: Keep what rollback needs (the links, the drop-in, ownership.json)
  ansible.builtin.command:
    argv: "{{ ck_pointers + ['save'] }}"
  environment: "{{ ck_pointers_env }}"
  changed_when: "'already saved' not in ck_saved.stdout"
  register: ck_saved
  when: connectome_kitchen_operation == 'prepare' and not ck_first

- name: Show what was kept
  ansible.builtin.debug:
    var: ck_saved.stdout_lines
  when: connectome_kitchen_operation == 'prepare' and not ck_first

# prepare of a first install, first: there is nothing to keep. What is held instead is that nothing is deployed.
- name: Hold that nothing is deployed, and keep the marker of a first install
  ansible.builtin.command:
    argv: "{{ ck_first_script + ['hold', connectome_kitchen_build] }}"
  environment: "{{ ck_first_env }}"
  changed_when: "(ck_first_holds.stdout_lines[-1] | default('')).startswith('first: held:')"
  failed_when: false
  register: ck_first_holds
  when: connectome_kitchen_operation == 'prepare' and ck_first

- name: Show what was held
  ansible.builtin.debug:
    var: ck_first_holds.stdout_lines
  when: connectome_kitchen_operation == 'prepare' and ck_first

- name: Stop unless nothing is deployed
  ansible.builtin.assert:
    that: ck_first_holds.rc == 0
    fail_msg: "{{ ck_first_holds.stdout_lines[-1] | default('kitchen-first.sh hold exited ' + (ck_first_holds.rc | string)) }} Nothing was built."
  when: connectome_kitchen_operation == 'prepare' and ck_first

# prepare with an agreed drift: kitchen holds the running build to it in its read-only check first, and what it agreed
# is kept in the save directory before the build is made. The prepare below holds it again, as its plan does.
- name: Hold the running build to the agreed drift (kitchen check; nothing is written but the runner's log)
  ansible.builtin.include_tasks: runner.yml
  vars:
    ck_mode: check
  when: connectome_kitchen_operation == 'prepare' and (connectome_kitchen_agreed_drift | length) > 0

- name: Refuse unless kitchen agreed exactly the declared drift of the running build
  ansible.builtin.assert:
    that:
      - ck_result.plan.prepare.agreed_drift is defined
      - ck_result.plan.prepare.agreed_drift.build == connectome_kitchen_live_build
      - (ck_result.plan.prepare.agreed_drift.files | map(attribute='path') | list) == (connectome_kitchen_agreed_drift | map(attribute='path') | list)
      - (ck_result.plan.prepare.agreed_drift.files | map(attribute='actual_sha256') | list) == (connectome_kitchen_agreed_drift | map(attribute='sha256') | list)
    fail_msg: "Kitchen did not answer the agreed drift of build {{ connectome_kitchen_live_build[:8] }} as declared (is the kitchen install one that knows agreed_drift?). Nothing was prepared."
  when: connectome_kitchen_operation == 'prepare' and (connectome_kitchen_agreed_drift | length) > 0

- name: Keep what kitchen agreed (path, locked and actual digest), before anything is prepared
  ansible.builtin.copy:
    dest: "{{ connectome_kitchen_save_dir }}/agreed-drift.{{ connectome_kitchen_build }}.json"
    mode: "0600"
    content: "{{ ck_result.plan.prepare.agreed_drift | to_nice_json }}"
  when: connectome_kitchen_operation == 'prepare' and (connectome_kitchen_agreed_drift | length) > 0

- name: Show the agreed drift
  ansible.builtin.debug:
    msg: "{{ ['agreed drift of the running build ' + connectome_kitchen_live_build[:8] + ', kept in ' + connectome_kitchen_save_dir + '/agreed-drift.' + connectome_kitchen_build + '.json:'] + (ck_result.plan.prepare.agreed_drift.files | map('to_json') | list) }}"
  when: connectome_kitchen_operation == 'prepare' and (connectome_kitchen_agreed_drift | length) > 0

# plan, prepare, verify: one step of the runner each.

- name: Run kitchen (check, prepare or verify)
  ansible.builtin.include_tasks: runner.yml
  vars:
    ck_mode: "{{ {'plan': 'check', 'prepare': 'prepare', 'verify': 'verify'}[connectome_kitchen_operation] }}"
  when: connectome_kitchen_operation in ['prepare', 'verify'] or (connectome_kitchen_operation == 'plan' and connectome_kitchen_build != '')

- name: Record the prepared build and state directory identities
  ansible.builtin.command:
    argv: "{{ ck_first_script + ['claim-initial' if ck_first_holds is changed else 'claim', connectome_kitchen_build] }}"
  environment: "{{ ck_first_env }}"
  changed_when: false
  when: ck_first and connectome_kitchen_operation == 'prepare'

# A prepare the engine refused or that failed may leave an unfinished directory under the build's name. The plan then
# still says there is a build to make: there is nothing to hold against the running build, and nothing to mark.
- name: Refuse to verify a build that is not prepared
  ansible.builtin.assert:
    that: ck_result.plan.prepare.changed is false
    fail_msg: "Build {{ connectome_kitchen_build[:8] }} is not prepared: the plan still has it to make (prepare has not run, was refused, or failed). Nothing was held, nothing was marked for a start. Read what prepare said, then prepare again."
  when: connectome_kitchen_operation == 'verify'

- name: Hold the new build against the running one, and keep the baseline of the process for readback
  ansible.builtin.include_tasks: inspect.yml
  vars:
    ck_inspections: [compare, baseline]
  when: connectome_kitchen_operation == 'verify' and not ck_first

- name: Hold what verify found, for the start
  ansible.builtin.command:
    argv: "{{ ck_pointers + ['mark', connectome_kitchen_build, ck_environment, 'inspection-ok' if (ck_inspect_rc | int) == 0 else 'inspection-LOOK'] }}"
  environment: "{{ ck_pointers_env }}"
  changed_when: true
  when: connectome_kitchen_operation == 'verify' and not ck_first

- name: Say where verify leaves it
  ansible.builtin.debug:
    msg:
      - "verify: build {{ connectome_kitchen_build[:8] }} is prepared beside the running {{ connectome_kitchen_live_build[:8] }}; nothing of the running deployment was changed"
      - "the secrets file gives the new process {{ {'same-environment': 'the environment the running one has', 'new-secret-files': 'the environment and the secret files the running one has and the new ones named (' + (connectome_kitchen_secret_files_new | sort | join(', ')) + '), which are not there yet; the environment file differs in those names and in no other', 'ANOTHER-ENVIRONMENT': 'ANOTHER environment or secret file than the running one has, beyond what is named as new: the start refuses. Know why first (connectome_kitchen_secrets_differ_ok takes every difference, named or not)'}[ck_environment] }}"
      - "{{ ck_environment_words }}"
      - "{{ 'the comparison with the running build has no LOOK line' if (ck_inspect_rc | int) == 0 else 'the comparison with the running build has LOOK lines above: read them before the start' }}"
  when: connectome_kitchen_operation == 'verify' and not ck_first

# verify of a first install: no build runs, so the new build is held by itself, and no baseline is kept.
- name: Hold the new build by itself
  ansible.builtin.include_tasks: inspect.yml
  vars:
    ck_inspections: [alone]
  when: connectome_kitchen_operation == 'verify' and ck_first

- name: Hold what verify found of the first build, for the start
  ansible.builtin.command:
    argv: "{{ ck_first_script + ['mark', connectome_kitchen_build, ck_environment, 'inspection-ok' if (ck_inspect_rc | int) == 0 else 'inspection-LOOK'] }}"
  environment: "{{ ck_first_env }}"
  changed_when: true
  when: connectome_kitchen_operation == 'verify' and ck_first

- name: Say where verify leaves a first install
  ansible.builtin.debug:
    msg:
      - "verify: build {{ connectome_kitchen_build[:8] }} is prepared; {{ 'the agent is installed on it: the first start has been done' if ck_environment == 'installed-environment' else 'nothing of it is installed by the first start yet' }}"
      - "{{ {'first-environment': 'the secrets file holds every declared name, there is no environment file yet, and none of the secret files the start writes is there', 'installed-environment': 'the environment file and the secret files the first start wrote are what the secrets file gives now', 'NOT-A-FIRST-ENVIRONMENT': 'NOT what a first install finds, and not what a first start leaves: an environment file or a secret file of this deployment is there and is not what the secrets file gives. A start refuses'}[ck_environment] }}"
      - "{{ ck_environment_words }}"
      - "{{ 'the build has no LOOK line' if (ck_inspect_rc | int) == 0 else 'the build has LOOK lines above: read them before the start' }}"
  when: connectome_kitchen_operation == 'verify' and ck_first

# start: the one restart. rollback: the way back. readback: what the agent shows afterwards. clear: before a retry.

- name: Start the agent on the prepared build
  ansible.builtin.include_tasks: start.yml
  when: connectome_kitchen_operation == 'start' and not ck_first

- name: Start the agent for the first time
  ansible.builtin.include_tasks: start-first.yml
  when: connectome_kitchen_operation == 'start' and ck_first

- name: Stop the agent and remove its first install
  ansible.builtin.include_tasks: remove.yml
  when: ck_removes

- name: Put the previous build back
  ansible.builtin.include_tasks: rollback.yml
  when: connectome_kitchen_operation == 'rollback'

- name: Read back what the agent shows
  ansible.builtin.include_tasks: inspect.yml
  vars:
    ck_inspections: [readback]
  when: connectome_kitchen_operation == 'readback'

- name: Say what readback found
  ansible.builtin.debug:
    msg: "{{ 'readback: every line ok' if (ck_inspect_rc | int) == 0 else 'readback: LOOK lines above. Nothing was changed by reading' }}"
  when: connectome_kitchen_operation == 'readback'

# clear: after a way back, the secret files this request introduced are files the saved deployment does not declare,
# and the engine refuses them. Exactly those are removed; nothing else is, and nothing restarts.
- name: Remove the secret files this window introduced, where the agent runs the saved build again
  ansible.builtin.command:
    argv: "{{ ck_pointers + ['clear'] + (connectome_kitchen_secret_files_new | sort) }}"
  environment: "{{ ck_pointers_env }}"
  changed_when: "'removed ' in ck_cleared.stdout"
  failed_when: false
  register: ck_cleared
  when: connectome_kitchen_operation == 'clear'

- name: Show what was cleared
  ansible.builtin.debug:
    msg: "{{ ck_cleared.stdout_lines + ['clear: exit ' + (ck_cleared.rc | string) + ' (' + {0: 'nothing of this window is in the way of a retry', 60: 'refused before any change', 63: 'a removal failed; the agent is not touched by it'}.get(ck_cleared.rc, 'unexpected') + ')'] }}"
  when: connectome_kitchen_operation == 'clear'

- name: Stop unless it was cleared
  ansible.builtin.assert:
    that: ck_cleared.rc == 0
    fail_msg: "clear of {{ ck_name }} exited {{ ck_cleared.rc }}. Nothing restarts in this operation; read its lines above."
  when: connectome_kitchen_operation == 'clear'
