---
# One step of the runner of kitchen (scripts/takeover.mjs MODE --input FILE), as the account, in a closed environment.
# In: ck_mode (check, prepare, verify, start). Out: ck_result: rc, plan, same_environment, environment_file, secret_files,
# unclosed (files/kitchen-step.py). After verify also: ck_secrets, the names in which the environment file of a start
# would differ from the running build's (files/kitchen-secrets.mjs), and ck_environment: same-environment,
# new-secret-files or ANOTHER-ENVIRONMENT, with ck_environment_words to say it. For a first install there is no running
# build: ck_environment is first-environment, installed-environment (after the first start) or NOT-A-FIRST-ENVIRONMENT,
# from the runner's answer alone.
# The step helper prints the closed part of what the runner wrote. An engine failure that is not one of its refusals has
# the text of an exception; that line is not shown and stays in the log of the account.

- name: "Run kitchen: {{ ck_mode }}"
  ansible.builtin.command:
    argv: "{{ [connectome_kitchen_python, '-I', role_path + '/files/kitchen-step.py', ck_mode, '/usr/bin/timeout', '-k', '15', connectome_kitchen_runner_timeout_seconds | string] + ck_as + [connectome_kitchen_node, connectome_kitchen_home + '/scripts/takeover.mjs', ck_mode, '--input', ck_keep + '/inputs/request.json'] }}"
    chdir: "{{ connectome_kitchen_home }}"
  changed_when: ck_mode in ['prepare', 'start']
  register: ck_run

- name: "Read the answer of kitchen: {{ ck_mode }}"
  ansible.builtin.set_fact:
    ck_result: "{{ ck_run.stdout_lines[-1][7:] | from_json }}"

# The runner answers yes or no for the environment file as a whole. Which names differ is asked here, of the same
# secrets file and the same request, with kitchen's own reading of the layers. Names only leave the helper.
- name: "Ask in which names the environment file would differ from the running build's (names, never a value): {{ ck_mode }}"
  ansible.builtin.command:
    argv: "{{ ck_as + [connectome_kitchen_node, role_path + '/files/kitchen-secrets.mjs', connectome_kitchen_home, ck_keep + '/inputs/request.json', 'proposed'] }}"
    chdir: "{{ connectome_kitchen_home }}"
  changed_when: false
  failed_when: false
  no_log: true
  register: ck_compared
  when: ck_mode == 'verify' and not ck_first

- name: "Read the names: {{ ck_mode }}"
  ansible.builtin.set_fact:
    ck_secrets: "{{ (ck_compared.stdout | from_json) if (ck_compared.rc in [0, 3] and ck_compared.stdout[:1] == '{') else {'compared': false, 'reason': 'the comparison could not be run (exit ' + (ck_compared.rc | string) + ')'} }}"
  when: ck_mode == 'verify' and not ck_first

# same-environment: the runner says so and no name differs.
# new-secret-files: nothing is changed and nothing removed; what is added is exactly the secret files named as new, each
# a secret file of the request; and, by the runner, every other secret file is what the start would write and none of
# the named ones is there yet. Any other difference, or no comparison: ANOTHER-ENVIRONMENT.
- name: "Say what the secrets file gives the new process: {{ ck_mode }}"
  ansible.builtin.set_fact:
    ck_environment: "{{ 'ANOTHER-ENVIRONMENT' if not ck_secrets.compared else ('same-environment' if (ck_result.same_environment and ((ck_secrets.changed + ck_secrets.added + ck_secrets.removed) | length) == 0) else ('new-secret-files' if ((connectome_kitchen_secret_files_new | length) > 0 and ck_result.environment_file is false and (ck_secrets.changed | length) == 0 and (ck_secrets.removed | length) == 0 and (ck_secrets.added | sort) == (connectome_kitchen_secret_files_new | sort) and (connectome_kitchen_secret_files_new | reject('in', ck_secrets.secret_files) | list | length) == 0 and (ck_result.secret_files | dict2items | rejectattr('value', 'true') | map(attribute='key') | sort) == (connectome_kitchen_secret_files_new | sort) and (ck_result.secret_files | dict2items | rejectattr('value', 'true') | map(attribute='value') | reject('none') | list | length) == 0) else 'ANOTHER-ENVIRONMENT')) }}"
    ck_environment_words: "{{ ('names of the environment file: ' + (ck_secrets.same | length | string) + ' the same; changed: ' + (ck_secrets.changed | join(', ') | default('none', true)) + '; added: ' + (ck_secrets.added | join(', ') | default('none', true)) + '; removed: ' + (ck_secrets.removed | join(', ') | default('none', true)) + '. Secret files that are not what the start would write: ' + (ck_result.secret_files | dict2items | selectattr('value', 'false') | map(attribute='key') | sort | join(', ') | default('none', true)) + '; not there: ' + (ck_result.secret_files | dict2items | selectattr('value', 'none') | map(attribute='key') | sort | join(', ') | default('none', true))) if ck_secrets.compared else ('the environment file could not be held name by name: ' + ck_secrets.reason) }}"
  when: ck_mode == 'verify' and not ck_first

# A first install: no build runs, so there is no environment file to hold a start to. What the runner answers is then
# all there is to say: it refuses a secrets file that lacks a declared name, and says of the environment file and of each
# secret file whether it is what a start would write (yes), another (no), or not there (null). Before the first start
# every one of them must be "not there" (first-environment); after it, every one "yes" (installed-environment).
- name: "Say what a first start finds of the environment: {{ ck_mode }}"
  ansible.builtin.set_fact:
    ck_environment: "{{ 'first-environment' if (ck_result.rc == 0 and ck_result.environment_file is none and (ck_result.secret_files | dict2items | map(attribute='value') | reject('none') | list | length) == 0) else ('installed-environment' if (ck_result.rc == 0 and ck_result.same_environment and ck_result.plan.activate.changed is false) else 'NOT-A-FIRST-ENVIRONMENT') }}"
    ck_environment_words: "{{ 'environment file of the prepared build: ' + ({true: 'there, and what a start would write', false: 'not what a start would write, or unreadable'}[ck_result.environment_file] | default('none')) + '. Secret files the start writes: ' + (ck_result.secret_files | sort | join(', ') | default('none', true)) + '; there already: ' + (ck_result.secret_files | dict2items | rejectattr('value', 'none') | map(attribute='key') | sort | join(', ') | default('none', true)) }}"
  when: ck_mode == 'verify' and ck_first

- name: "Show the answer of kitchen: {{ ck_mode }}"
  ansible.builtin.debug:
    msg: "{{ ck_run.stdout_lines[:-1] }}"

- name: "Stop unless kitchen is done and plans the pinned build: {{ ck_mode }}"
  ansible.builtin.assert:
    that:
      - ck_result.rc == 0
      - ck_result.plan.prepare.build_dir == connectome_root + '/builds/' + connectome_kitchen_build
    fail_msg: "kitchen {{ ck_mode }} exited {{ ck_result.rc }}, or its plan names another build than {{ connectome_kitchen_build }}. Nothing of the running deployment was changed by this step."
  when: ck_mode != 'start'
